<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Director - Personal History Project v35.0 (Let It Be Preview)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Meiryo', sans-serif; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; background: #000; }
        
        video, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        canvas { display: none; z-index: 2; }
        video { z-index: 1; transition: filter 1s ease; }

        .ui { position: absolute; z-index: 10; width: 100%; text-align: center; pointer-events: none; left: 0; }
        
        #ai-caption {
            top: 5%; background: rgba(255, 0, 0, 0.95); padding: 15px 10px;
            font-size: 1.3rem; font-weight: bold; border: 2px solid #fff;
            opacity: 0; transition: opacity 0.4s; min-height: 40px;
            width: 90%; left: 5%; box-sizing: border-box;
        }

        #ai-reaction {
            top: 25%; font-size: 1.4rem; color: #ffff00; font-weight: bold;
            text-shadow: 2px 2px 4px #000; opacity: 0; transition: opacity 0.3s;
        }

        #warning-toast {
            top: 42%; background: rgba(255, 255, 0, 0.95); color: #000;
            padding: 15px 20px; font-size: 1.4rem; font-weight: bold;
            display: none; border-radius: 10px; box-shadow: 0 0 30px #ff0;
            z-index: 100; width: 80%; left: 10%; box-sizing: border-box;
        }

        #target-box {
            position: absolute; border: 5px solid #f00; width: 220px; height: 220px;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; box-shadow: 0 0 30px #f00; z-index: 5;
        }

        /* スタート画面 */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff url('https://images.tango-frames.com/api/v1/images/f43f83.png') no-repeat center center;
            background-size: contain; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; padding: 20px;
            box-sizing: border-box;
        }
        #start-screen h1 { color: #000; text-shadow: 1px 1px 10px rgba(255,255,255,0.8); font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .terms { background: rgba(0, 0, 0, 0.90); color: #fff; padding: 15px; font-size: 0.85rem; max-width: 100%; margin-bottom: 25px; line-height: 1.6; border: 2px solid #f00; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .btn-group { display: flex; flex-direction: column; gap: 15px; width: 80%; }

        /* カメラ切り替えボタン */
        #camera-toggle-btn {
            position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.8);
            color: #fff; border: 2px solid #fff; padding: 12px 20px; font-size: 1rem;
            font-weight: bold; border-radius: 25px; z-index: 30; display: none;
            pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }

        /* 進行ボタン */
        #action-container {
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); z-index: 160; width: 85%; display: none; pointer-events: auto;
        }
        #action-btn {
            background: #007fff; color: #fff; padding: 20px; font-size: 1.3rem;
            font-weight: bold; border: 3px solid #fff; border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,127,255,0.8); width: 100%;
        }

        /* カスタムモーダル */
        #custom-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 250; display: none;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
            box-sizing: border-box;
        }
        .modal-box {
            background: #1c1c1e; border: 2px solid #007fff; border-radius: 20px;
            width: 90%; max-width: 400px; padding: 25px 20px; box-sizing: border-box;
Text-align: center; box-shadow: 0 10px 30px rgba(0,127,255,0.4);
        }
        .modal-box p { font-size: 1.1rem; font-weight: bold; margin-top: 0; margin-bottom: 20px; line-height: 1.5; color: #fff; }
        .modal-box input {
            width: 100%; padding: 15px; font-size: 1.2rem; background: #2c2c2e;
            color: #fff; border: 1px solid #555; border-radius: 10px; margin-bottom: 25px;
            box-sizing: border-box; text-align: center; outline: none;
        }

        /* 最後の「撮影を終了する」ボタンの位置 */
        #finish-layer { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); width: 85%; display: none; background: none; z-index: 210; }
        #dialog-layer { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); display: none; flex-direction: column; gap: 15px; z-index: 150; width: 80%; }

        button { padding: 18px 30px; font-size: 1.1rem; background: #f00; color: #fff; border: none; border-radius: 50px; cursor: pointer; pointer-events: auto; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 100%; -webkit-tap-highlight-color: transparent; }
        button:hover { background: #ff3333; }
        button.cancel { background: #333; border: 1px solid #555; color: #fff; }
        button.sub { background: #007fff; }
        .modal-box button { background: #007fff; border-radius: 12px; padding: 15px; width: 100%; }

        /* 💡 演出拡張：映画的シネマスコープ（完成プレビュー時にせり出す黒帯） */
        .cinema-mask {
            position: absolute; left: 0; width: 100%; height: 0; background: #000;
            z-index: 40; transition: height 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #mask-top { top: 0; }
        #mask-bottom { bottom: 0; }

        /* 💡 演出拡張：テレビ東京品質の事後編集エミュレートテロップ */
        #tv-render-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; z-index: 300; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #ff0000; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #tv-preview-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        #tv-main-title {
            font-family: 'Noto Serif JP', serif; font-weight: 900; font-size: 1.8rem;
            color: #fff; text-shadow: 0px 0px 15px rgba(0,0,0,1), 3px 3px 0px rgba(0,0,0,1);
            text-align: center; line-height: 1.7; opacity: 0; transition: opacity 2s ease;
            width: 100%; word-break: break-all;
        }
        #tv-sub-caption {
            font-family: 'Noto Serif JP', serif; font-weight: 900; font-size: 1.2rem;
            color: #ffff00; text-shadow: 2px 2px 5px #000; margin-top: 25px;
            opacity: 0; transition: opacity 1.5s ease; text-align: center;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="mask-top" class="cinema-mask"></div>
    <div id="mask-bottom" class="cinema-mask"></div>

    <div id="start-screen">
        <h1>AIディレクター：自分史撮影</h1>
        <div class="terms">
            <h3 style="margin-top:0; color:#ff3333; font-size: 1rem;">【最初にお読みください】</h3>
            ・本件において撮影された映像の著作権、肖像権についてはテレビテレビ東京に帰属します。<br>
            ・映像を撮影した後に、「編集を申し込む」ボタンを押した時点で料金が発生します。
        </div>
        <div class="btn-group">
            <button id="btn-run">撮影を開始する</button>
            <button class="cancel" onclick="location.reload();">キャンセル</button>
        </div>
    </div>

    <div id="tv-render-screen">
        <div class="spinner"></div>
        <p style="font-family:'Noto Serif JP', serif; font-size:1.2rem; letter-spacing:2px; color:#fff;">テレビ東京 AI編集エンジン<br>動画レンダリング中...</p>
    </div>

    <div id="tv-preview-layer">
        <div id="tv-main-title"></div>
        <div id="tv-sub-caption"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-box">
            <p id="modal-title">質問内容</p>
            <input type="text" id="modal-input" placeholder="ここに入力してください" autofocus>
            <button id="modal-submit-btn">決定</button>
        </div>
    </div>

    <div id="action-container">
        <button id="action-btn">次へ進む</button>
    </div>

    <button id="camera-toggle-btn" onclick="toggleCameraHandy()">🔄 カメラ切替</button>

    <div id="dialog-layer">
        <button onclick="selectChoice('end')">🔴 撮影を終える</button>
        <button class="sub" onclick="selectChoice('continue')">🔵 撮影を続ける</button>
    </div>

    <div id="finish-layer">
        <button id="btn-finish" onclick="location.reload()">再挑戦（リロード）</button>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <div id="ai-caption" class="ui"></div>
    <div id="ai-reaction" class="ui"></div>
    <div id="warning-toast" class="ui">⚠️ もっとゆっくりカメラを動かしてください</div>
    <div id="target-box"></div>
</div>

<script>
    const v = document.getElementById('v');
    const c = document.getElementById('c');
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const caption = document.getElementById('ai-caption');
    const reaction = document.getElementById('ai-reaction');
    const toast = document.getElementById('warning-toast');
    const target = document.getElementById('target-box');
    const finishLayer = document.getElementById('finish-layer');
    const dialogLayer = document.getElementById('dialog-layer');
    const toggleBtn = document.getElementById('camera-toggle-btn');
    const actionContainer = document.getElementById('action-container');
    const actionBtn = document.getElementById('action-btn');
    
    const customModal = document.getElementById('custom-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalInput = document.getElementById('modal-input');
    const modalSubmitBtn = document.getElementById('modal-submit-btn');

    // 演出用DOM
    const maskTop = document.getElementById('mask-top');
    const maskBottom = document.getElementById('mask-bottom');
    const tvRenderScreen = document.getElementById('tv-render-screen');
    const tvMainTitle = document.getElementById('tv-main-title');
    const tvSubCaption = document.getElementById('tv-sub-caption');

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    let localStream = null;
    let currentStep = 0;
    let lastImgData = null;
    let staticCount = 0;
    let isActive = false;
    let recognition = null;
    let capturedText = "";
    let detectedName = ""; 
    let currentFacingMode = "user"; 
    let silenceTimer = null; 
    let hasSpeechRecognition = true; 
    let audioContextBgm = null; // Let It Be用

    const steps = [
        { msg: "こんにちは、AIディレクターです。まずはマイクに向かってお名前をお願い致します。", type: "voice_name" }, 
        { msg: "", type: "confirm" }, 
        { msg: "では、２０秒間でお部屋全体をゆっくり撮影してください。", type: "pan_timer", t: 20000 }, 
        { msg: "では、あなたの大切なものを中央に映してください。", type: "lock" }, 
        { msg: "これですね。これは何ですか。なぜ大切なのか、教えてください。", type: "voice_initial" }, 
        { msg: "", type: "voice_deep" }, 
        { msg: "では、あなたが見てほしいもう一つのものを見せてください", type: "lock2" }, 
        { msg: "これですね。これは何ですか。なぜ大切なのか、教えてください。", type: "voice_initial2" }, 
        { msg: "", type: "voice_deep2" },
        { msg: "ご自身の顔が映った状態で、家族へのメッセージをお話しください", type: "family_message" }
    ];

    function speakAI(text, onCompleteCallback) {
        if (!text) { if(onCompleteCallback) onCompleteCallback(); return; }
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 1.05;  
        utterance.pitch = 1.15; 
        utterance.onend = () => { if (onCompleteCallback) onCompleteCallback(); };
        utterance.onerror = () => { if (onCompleteCallback) onCompleteCallback(); };
        window.speechSynthesis.speak(utterance);
    }

    function showCustomInputModal(titleText, defaultVal, onValueSubmitted) {
        modalTitle.innerText = titleText;
        modalInput.value = defaultVal;
        customModal.style.display = "flex";
        setTimeout(() => { modalInput.focus(); }, 100);
        modalSubmitBtn.onclick = () => {
            customModal.style.display = "none";
            onValueSubmitted(modalInput.value.trim());
        };
    }

    async function startCamera(facingMode) {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop()); 
            v.srcObject = null;
            await new Promise(resolve => setTimeout(resolve, 800));
        }
        currentFacingMode = facingMode;
        v.style.transform = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
        const constraints = {
            video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false 
        };
        try {
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch(e) {
            constraints.video.facingMode = { ideal: facingMode };
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
        }
        v.srcObject = localStream;
        await v.play();
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isActualSafari = isIOS && /Version\/.*Safari/i.test(navigator.userAgent);

        if (!SpeechRecognition || (isIOS && !isActualSafari)) {
            hasSpeechRecognition = false;
            return;
        }
        
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true; 
        recognition.continuous = false; 

        recognition.onresult = (event) => {
            const result = event.results[event.results.length - 1];
            const transcript = result[0].transcript;
            
            if (silenceTimer) clearTimeout(silenceTimer);
            
            // 💡 修正ポイント：家族メッセージフェーズ（ステップ10）の音声をしっかり記憶に焼き付ける
            if (currentStep >= 9) {
                capturedText = transcript;
            }

            if (currentStep === 1) {
                detectedName = transcript.replace(/(です|と言います|私は|私の名前は|と申します)/g, "").trim();
            }

            if (transcript.match(/(昔|前|以前|苦労|大変|家族|父|母|仕事|地元|故郷|挫折|裏切り|恋|思い出|忘れられない|ほしかった|後悔|約束|別れ|旅立ち|宝物|親)/)) {
                showReaction("なるほど...");
            }

            if (isActive) {
                silenceTimer = setTimeout(() => {
                    if (currentStep === 1) {
                        if (isMobile && recognition) { try{ recognition.stop(); }catch(e){} }
                        next();
                    } else {
                        handleSilenceEnd();
                    }
                }, 2000); 
            }
        };

        recognition.onend = () => {
            if (isActive && !isMobile && currentStep <= 1) { try { recognition.start(); } catch(e){} }
        };
    }

    function handleSilenceEnd() {
        const stepInside = steps[currentStep-1];
        if (stepInside?.type === "voice_initial" || stepInside?.type === "voice_initial2") {
            const deepMsg = generateDeepQuestion();
            caption.innerText = deepMsg;
            if (stepInside.type === "voice_initial") { steps[currentStep-1].type = "voice_deep"; } 
            else { steps[currentStep-1].type = "voice_deep2"; }
            speakAI(deepMsg);
        } else if (stepInside?.type === "voice_deep" || stepInside?.type === "voice_deep2") {
            next(); 
        } else if (stepInside?.type === "family_message") {
            showEndDialog(); 
        }
    }

    function showReaction(text) {
        reaction.innerText = text;
        reaction.style.opacity = 1;
        setTimeout(() => { reaction.style.opacity = 0; }, 2000);
    }

    document.getElementById('btn-run').onclick = async () => {
        initSpeechRecognition();
        document.getElementById('start-screen').style.display = 'none';
        isActive = true;
        
        // Let It Be用AudioContext生成
        audioContextBgm = new (window.AudioContext || window.webkitAudioContext)();

        try { window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch(e){}

        const msg = steps[0].msg;
        caption.innerText = msg;
        caption.style.opacity = 1;
        currentStep = 1;

        if (isMobile) {
            const btnLabel = hasSpeechRecognition ? "🎙️ お名前を話す" : "⌨️ お名前を文字で入力";
            speakAI(msg, () => { setupMobileAction("start_voice_name", btnLabel); });
        } else {
            try {
                await startCamera("user"); 
                speakAI(msg, () => {
                    if (recognition) { try { recognition.start(); } catch(e){} }
                    next();
                });
                loop();
            } catch (e) { alert("カメラ起動に失敗しました。"); }
        }
    };

    async function toggleCameraHandy() {
        const targetMode = currentFacingMode === "user" ? "environment" : "user";
        await startCamera(targetMode);
    }

    function loop() {
        if (!isActive) { requestAnimationFrame(loop); return; }
        if (v.srcObject) {
            c.width = 160; c.height = 120;
            try { ctx.drawImage(v, 0, 0, c.width, c.height); } catch(e){}
        }
        try {
            const currentImgData = ctx.getImageData(0, 0, c.width, c.height);
            if (lastImgData) {
                let diff = 0;
                for (let i = 0; i < currentImgData.data.length; i += 4) {
                    const oldVal = (lastImgData.data[i] + lastImgData.data[i+1] + lastImgData.data[i+2]) / 3;
                    const newVal = (currentImgData.data[i] + currentImgData.data[i+1] + currentImgData.data[i+2]) / 3;
                    diff += Math.abs(newVal - oldVal);
                }
                const movementScore = diff / (c.width * c.height);
                const step = steps[currentStep-1];

                if (step?.type === "pan_timer" || step?.type === "lock" || step?.type === "lock2") {
                    if (movementScore > 35) { 
                        if (window.toastTimer) { clearTimeout(window.toastTimer); window.toastTimer = null; }
                        toast.style.display = "block";
                    } else if (movementScore < 25) { 
                        if (!window.toastTimer && toast.style.display === "block") {
                            window.toastTimer = setTimeout(() => { toast.style.display = "none"; window.toastTimer = null; }, 1000); 
                        }
                    }
                }

                if (step?.type === "lock" || step?.type === "lock2") {
                    if (movementScore < 6) { 
                        staticCount++;
                        if (staticCount > 90) { 
                            staticCount = 0;
                            target.style.display = "none"; 
                            
                            if (isMobile) {
                                c.width = v.videoWidth || 640;
                                c.height = v.videoHeight || 480;
                                ctx.drawImage(v, 0, 0, c.width, c.height);
                                c.style.display = "block"; 
                                if (localStream) { localStream.getTracks().forEach(track => track.stop()); v.srcObject = null; }

                                const initialMsg = "これですね。これは何ですか。なぜ大切なのか、教えてください。";
                                caption.innerText = initialMsg;
                                const btnLabel = hasSpeechRecognition ? "🎙️ お話を始める" : "⌨️ テキストで回答する";

                                if (step.type === "lock") {
                                    currentStep = 5; 
                                    speakAI(initialMsg, () => { setupMobileAction("start_voice_initial", btnLabel); });
                                } else {
                                    currentStep = 8; 
                                    speakAI(initialMsg, () => { setupMobileAction("start_voice_initial2", btnLabel); });
                                }
                            } else { setTimeout(next, 1000); }
                        }
                    } else { staticCount = 0; target.style.display = "none"; }
                }
            }
            lastImgData = currentImgData;
        } catch(e) { }
        requestAnimationFrame(loop);
    }

    function setupMobileAction(mode, btnText) {
        if (mode === "none") { actionContainer.style.display = "none"; return; }
        actionBtn.innerText = btnText;
        actionContainer.style.display = "block";
        
        actionBtn.onclick = async () => {
            actionContainer.style.display = "none";
            
            if (mode === "start_voice_name") {
                if (hasSpeechRecognition) { if (recognition) { try { recognition.start(); } catch(e){} } } 
                else {
                    showCustomInputModal("お名前を入力してください", "渡辺睦", (text) => {
                        detectedName = text ? text : "渡辺睦"; next(); 
                    });
                }
            }
            else if (mode === "start_voice_initial") {
                if (hasSpeechRecognition) {
                    if (recognition) { capturedText = ""; try { recognition.start(); } catch(e){} }
                    setupMobileAction("to_deep_question", "話を終える（次へ進む）");
                } else {
                    showCustomInputModal("これは何ですか？なぜ大切なのか教えてください", "", async (text) => {
                        capturedText = text ? text : "";
                        const deepMsg = generateDeepQuestion();
                        caption.innerText = deepMsg; c.style.display = "none";
                        await startCamera("environment");
                        speakAI(deepMsg, () => { setupMobileAction("to_second_object_prompt", "次へ進む"); });
                    });
                }
            }
            else if (mode === "start_voice_initial2") {
                if (hasSpeechRecognition) {
                    if (recognition) { capturedText = ""; try { recognition.start(); } catch(e){} }
                    setupMobileAction("to_deep_question2", "話を終える（次へ進む）");
                } else {
                    showCustomInputModal("これは何ですか？なぜ大切なのか教えてください", "", async (text) => {
                        capturedText = text ? text : "";
                        const deepMsg = generateDeepQuestion();
                        caption.innerText = deepMsg; c.style.display = "none";
                        await startCamera("environment");
                        speakAI(deepMsg, () => { setupMobileAction("to_family_message", "次へ進む"); });
                    });
                }
            }
            else if (mode === "start_camera_after_voice") { await startCamera("user"); loop(); next(); } 
            else if (mode === "to_deep_question") {
                if (recognition) { try{ recognition.stop(); }catch(e){} }
                const deepMsg = generateDeepQuestion();
                caption.innerText = deepMsg; c.style.display = "none";
                await startCamera("environment");
                speakAI(deepMsg, () => { setupMobileAction("to_second_object_prompt", "次へ進む"); });
            } 
            else if (mode === "to_second_object_prompt") {
                const promptMsg = "では、あなたが見てほしいもう一つのものを見せてください";
                caption.innerText = promptMsg; currentStep = 7; 
                speakAI(promptMsg, () => { setupMobileAction("none", ""); });
            } 
            else if (mode === "to_deep_question2") {
                if (recognition) { try{ recognition.stop(); }catch(e){} }
                const deepMsg = generateDeepQuestion();
                caption.innerText = deepMsg; c.style.display = "none";
                await startCamera("environment");
                speakAI(deepMsg, () => { setupMobileAction("to_family_message", "次へ進む"); });
            } 
            else if (mode === "to_family_message") {
                const famMsg = "ご自身の顔が映った状態で、家族へのメッセージをお話しください";
                caption.innerText = famMsg; c.style.display = "none";
                await startCamera("user"); currentStep = 10; 
                speakAI(famMsg, () => {
                    const nextBtnLabel = hasSpeechRecognition ? "🎙️ メッセージを話す" : "⌨️ 文字で入力する";
                    setupMobileAction("trigger_final_voice", nextBtnLabel);
                });
            }
            else if (mode === "trigger_final_voice") {
                if (hasSpeechRecognition) {
                    if (recognition) { capturedText = ""; try { recognition.start(); } catch(e){} }
                    setupMobileAction("to_end_dialog", "話を終える（次へ進む）");
                } else {
                    showCustomInputModal("家族へのメッセージを入力してください", "", (text) => {
                        capturedText = text ? text : ""; showEndDialog();
                    });
                }
            }
            else if (mode === "to_end_dialog") { if (recognition) { try{ recognition.stop(); }catch(e){} } showEndDialog(); }
        };
    }

    function generateDeepQuestion() {
        let deepMsg = "";
        if (capturedText.match(/(裏切り|挫折|後悔|大変|苦労)/)) { deepMsg = "その出来事は、あなたの人生にどんな傷や、逆にどんな強さを残しましたか？"; } 
        else if (capturedText.match(/(ほしかった|忘れられない|思い出|宝物)/)) { deepMsg = "今、それが手に入ったら、当時の自分に何と言ってあげたいですか？"; } 
        else if (capturedText.match(/(恋|別れ|約束)/)) { deepMsg = "そのお相手は、今のあなたの暮らしや頑張りを、どこかで見守ってくれている気がしますか？"; } 
        else if (capturedText.match(/(家族|父|母|子供|親)/)) { deepMsg = "そのこと、ご家族の方は何と仰っているんですか？"; } 
        else if (capturedText.match(/(仕事|会社|旅立ち|地元|故郷)/)) { deepMsg = "そこから離れて今に至るまでに、一番の心の支えになったものは何ですか？"; } 
        else { deepMsg = "なぜ、今そのお話をしようと思ったんですか？その奥にある想いを聞かせてください。"; }
        capturedText = ""; toggleBtn.style.display = "block"; return deepMsg;
    }

    function showEndDialog() {
        const endMsg = "撮影を終了しますか？";
        caption.innerText = endMsg; 
        speakAI(endMsg, () => { dialogLayer.style.display = "flex"; });
    }

    function selectChoice(action) {
        dialogLayer.style.display = "none"; 
        if (action === 'end') {
            toggleBtn.style.display = "none"; 
            actionContainer.style.display = "none"; 
            caption.style.opacity = 0;

            // 💡 睦様、ここが「編集魔法」をスマホ内で即座に体験する新エミュレータです！
            runTvPostProduction();
        } else {
            const contMsg = "もっと聞かせてください。その奥には、どんな物語がありますか？";
            caption.innerText = contMsg;
            speakAI(contMsg, () => { setupMobileAction("to_end_dialog", "話を終える（次へ進む）"); });
        }
    }

    // 💡 新設：テレビ東京の編集魔法・全自動擬似プレビュー上映ロジック
    function runTvPostProduction() {
        // 1. まず「レンダリング中」のインサート画面を3秒間挟み、編集の期待感を高める
        tvRenderScreen.style.display = "flex";

        setTimeout(async () => {
            tvRenderScreen.style.display = "none"; // レンダリング完了
            
            // 2. スマホのカメラをインカメラ（自撮り）で緊急再起動し、「上映用の生背景」にする
            await startCamera("user");
            
            // 3. 映像ルックを映画・ドキュメンタリー調（カラーグレーディング風）に強制加工
            v.style.filter = "grayscale(0.2) contrast(1.15) brightness(0.95)";
            
            // 4. 映画的上下黒帯（シネマスコープ）をせり出させる
            maskTop.style.height = "13vh";
            maskBottom.style.height = "13vh";

            // 5. あのビートルズの『Let It Be』風の温かい和音イントロをWeb Audioで自動再生！
            playLetItBeSynth();

            // 6. 1.5秒後、テレビ東京のドキュメンタリーでおなじみの「あの極太明朝体テロップ」がスッと降臨！
            setTimeout(() => {
                const finalQuote = capturedText.trim() || "なぜ、今そのお話をしようと思ったのか。その奥にある想い。";
                tvMainTitle.innerText = `「 ${finalQuote} 」`;
                tvMainTitle.style.opacity = 1;
            }, 1.50);

            // 7. 4.5秒後、エンドクレジットと、トップへ戻るためのリロードボタンを露出
            setTimeout(() => {
                const finalName = detectedName || "渡辺 睦";
                tvSubCaption.innerHTML = `語り手：${finalName}<br><br><span style="font-size:0.85rem;color:#ccc;letter-spacing:1px;">自分史ドキュメンタリープロジェクト<br>©︎テレビ東京</span>`;
                tvSubCaption.style.opacity = 1;
                finishLayer.style.display = "flex"; // リロードボタン出現
            }, 4500);

        }, 3000); // 3秒間のレンダリング演出
    }

    // 擬似Let It Beイントロシンセコード
    function playLetItBeSynth() {
        if (!audioContextBgm) return;
        const ctxB = audioContextBgm;
        if (ctxB.state === 'suspended') ctxB.resume();
        const chords = [
            [261.63, 329.63, 392.00], // C
            [196.00, 246.94, 293.66], // G
            [220.00, 261.63, 329.63], // Am
            [174.61, 220.00, 261.63]  // F
        ];
        let time = ctxB.currentTime;
        chords.forEach((chord, index) => {
            chord.forEach(freq => {
                const osc = ctxB.createOscillator();
                const gainNode = ctxB.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gainNode.gain.setValueAtTime(0, time + (index * 1.3));
                gainNode.gain.linearRampToValueAtTime(0.12, time + (index * 1.3) + 0.2);
                gainNode.gain.exponentialRampToValueAtTime(0.001, time + (index * 1.3) + 1.5);
                osc.connect(gainNode);
                gainNode.connect(ctxB.destination);
                osc.start(time + (index * 1.3));
                osc.stop(time + (index * 1.3) + 1.6);
            });
        });
    }

    async function next() {
        if (currentStep >= steps.length) return;
        const s = steps[currentStep];

        if (s.type === "confirm") {
            const name = detectedName || "渡辺睦";
            s.msg = `ありがとうございます。お名前は ${name} さんでよいですね？`;
            caption.innerText = s.msg;
            caption.style.opacity = 1;
            currentStep++;
            speakAI(s.msg, () => { if (isMobile) { setupMobileAction("start_camera_after_voice", "はい、カメラを起動して次へ進む"); } });
            return;
        }

        if (s.type === "pan_timer") {
            caption.innerText = s.msg;
            caption.style.opacity = 1;
            currentStep++;
            await startCamera("environment");
            speakAI(s.msg, () => { setTimeout(next, s.t); });
            return;
        }

        if (s.type === "lock") {
            caption.innerText = s.msg;
            caption.style.opacity = 1;
            currentStep++;
            speakAI(s.msg, () => { staticCount = 0; });
            return;
        }

        if (s.type === "family_message") {
            caption.innerText = s.msg;
            caption.style.opacity = 1;
            currentStep++;
            await startCamera("user");
            speakAI(s.msg, () => {
                const nextBtnLabel = hasSpeechRecognition ? "🎙️ メッセージを話す" : "⌨️ 文字で入力する";
                setupMobileAction("trigger_final_voice", nextBtnLabel);
            });
            return;
        }

        caption.innerText = s.msg;
        caption.style.opacity = 1;
        currentStep++;
    }
