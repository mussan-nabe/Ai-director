<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Director - Personal History Project v19.3 (Mobile Master)</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Meiryo', sans-serif; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; }
        
        /* インカメラ時はJavaScript側で反転、アウトカメラ時は正像に動的制御 */
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        .ui { position: absolute; z-index: 10; width: 100%; text-align: center; pointer-events: none; left: 0; }
        
        #ai-caption {
            top: 5%; background: rgba(255, 0, 0, 0.95); padding: 15px 10px;
            font-size: 1.3rem; font-weight: bold; border: 2px solid #fff;
            opacity: 0; transition: opacity 0.4s; min-height: 40px;
            width: 90%; left: 5%; box-sizing: border-box;
        }

        #ai-reaction {
            top: 25%; font-size: 1.4rem; color: #ffff00; font-weight: bold;
            text-shadow: 2px 2px 4px #000; opacity: 0; transition: opacity 0.3s;
        }

        #warning-toast {
            top: 42%; background: rgba(255, 255, 0, 0.95); color: #000;
            padding: 15px 20px; font-size: 1.4rem; font-weight: bold;
            display: none; border-radius: 10px; box-shadow: 0 0 30px #ff0;
            z-index: 100; width: 80%; left: 10%; box-sizing: border-box;
        }

        #target-box {
            position: absolute; border: 5px solid #f00; width: 220px; height: 220px;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; box-shadow: 0 0 30px #f00; z-index: 5;
        }

        /* ユーザーが自由にレンズをチェンジできる手動切り替えボタン */
        #camera-toggle-btn {
            position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.8);
            color: #fff; border: 2px solid #fff; padding: 12px 20px; font-size: 1rem;
            font-weight: bold; border-radius: 25px; z-index: 30; display: none;
            pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }

        /* 番組ロゴ背景スタート画面 */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff url('https://images.tango-frames.com/api/v1/images/f43f83.png') no-repeat center center;
            background-size: contain; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; padding: 20px;
            box-sizing: border-box;
        }
        
        #start-screen h1 { color: #000; text-shadow: 1px 1px 10px rgba(255,255,255,0.8); font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .terms { background: rgba(0, 0, 0, 0.90); color: #fff; padding: 15px; font-size: 0.85rem; max-width: 100%; margin-bottom: 25px; line-height: 1.6; border: 2px solid #f00; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .btn-group { display: flex; flex-direction: column; gap: 15px; width: 80%; }

        #finish-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; background: none; top: 80%; height: 20%; z-index: 210; }

        #dialog-layer {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; gap: 15px; z-index: 150; width: 80%;
        }

        button { padding: 18px 30px; font-size: 1.1rem; background: #f00; color: #fff; border: none; border-radius: 50px; cursor: pointer; pointer-events: auto; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 100%; -webkit-tap-highlight-color: transparent; }
        button:hover { background: #ff3333; }
        button.cancel { background: #333; border: 1px solid #555; color: #fff; }
        button.sub { background: #007fff; }
    </style>
</head>
<body>

<div id="container">
    <div id="start-screen">
        <h1>AIディレクター：自分史撮影</h1>
        <div class="terms">
            <h3 style="margin-top:0; color:#ff3333; font-size: 1rem;">【最初にお読みください】</h3>
            ・本件において撮影された映像の著作権、肖像権についてはテレビ東京に帰属します。<br>
            ・映像を撮影した後に、「編集を申し込む」ボタンを押した時点で料金が発生します。
        </div>
        <div class="btn-group">
            <button id="btn-run">撮影を開始する</button>
            <button class="cancel" onclick="location.reload();">キャンセル</button>
        </div>
    </div>

    <button id="camera-toggle-btn" onclick="toggleCameraHandy()">🔄 カメラ切替</button>

    <div id="dialog-layer">
        <button onclick="selectChoice('end')">🔴 撮影を終える</button>
        <button class="sub" onclick="selectChoice('continue')">🔵 撮影を続ける</button>
    </div>

    <div id="finish-layer" class="ui">
        <button id="btn-finish" onclick="location.reload()">撮影を終了する</button>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <div id="ai-caption" class="ui"></div>
    <div id="ai-reaction" class="ui"></div>
    <div id="warning-toast" class="ui">⚠️ もっとゆっくりカメラを動かしてください</div>
    <div id="target-box"></div>
</div>

<script>
    const v = document.getElementById('v');
    const c = document.getElementById('c');
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const caption = document.getElementById('ai-caption');
    const reaction = document.getElementById('ai-reaction');
    const toast = document.getElementById('warning-toast');
    const target = document.getElementById('target-box');
    const finishLayer = document.getElementById('finish-layer');
    const dialogLayer = document.getElementById('dialog-layer');
    const toggleBtn = document.getElementById('camera-toggle-btn');

    let localStream = null;
    let currentStep = 0;
    let lastImgData = null;
    let staticCount = 0;
    let isActive = false;
    let recognition = null;
    let capturedText = "";
    let detectedName = ""; 
    let isDeepMode = false; 
    let currentFacingMode = "user"; 
    let silenceTimer = null; 

    const steps = [
        { msg: "こんにちは、AIディレクターです。まずは、カメラに向かって自己紹介をお願い致します。", type: "voice_name" },
        { msg: "", type: "confirm" }, 
        { msg: "では、２０秒間でお部屋全体をゆっくり撮影してください。", type: "pan_timer", t: 20000 },
        { msg: "では、あなたの大切なものを中央に映してください。じっと見つめます。", type: "lock" },
        { msg: "これですね。これは何ですか。なぜ大切なのか、教えてください。", type: "voice_deep" },
        { msg: "貴重な話をありがとうございます。追加で話しておきたいことはありますか？", type: "last_call" }
    ];

    // 💡 エラーの起きない安全なカメラ起動システム（exactを排除）
    async function startCamera(facingMode) {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop()); 
            v.srcObject = null;
        }
        
        currentFacingMode = facingMode;
        v.style.transform = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";

        // Androidがエラーを起こさないための柔軟な設定（ideal）に変更
        const constraints = {
            video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: true
        };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        v.srcObject = localStream;
        await v.play();
    }

    // 音声認識（文字起こし）の安全起動
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;
        
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onresult = (event) => {
            const result = event.results[event.results.length - 1];
            const transcript = result[0].transcript;
            
            if (silenceTimer) clearTimeout(silenceTimer);

            if (currentStep === 1) {
                detectedName = transcript.replace(/(です|と言います|私は|私の名前は|と申します)/g, "").trim();
            }

            if (result.isFinal) {
                capturedText += transcript;
            }

            if (transcript.match(/(昔|前|以前|苦労|大変|家族|父|母|仕事|地元|故郷|挫折|裏切り|恋|思い出|忘れられない|ほしかった|後悔|約束|別れ|旅立ち|宝物)/)) {
                showReaction("なるほど...");
            }

            const stepInside = steps[currentStep-1];
            if (isActive && (stepInside?.type === "voice_name" || stepInside?.type === "confirm" || stepInside?.type === "voice_deep" || stepInside?.type === "voice_more")) {
                silenceTimer = setTimeout(() => {
                    handleSilenceEnd(stepInside);
                }, 2000); 
            }
        };

        recognition.onend = () => {
            if (isActive) {
                try { recognition.start(); } catch(e){}
            }
        };

        recognition.start();
    }

    function handleSilenceEnd(stepInside) {
        if (stepInside.type === "voice_deep" && !isDeepMode) {
            generateDeepQuestion();
        } 
        else if (stepInside.type === "voice_deep" && isDeepMode) {
            showEndDialog();
        } 
        else if (stepInside.type === "voice_more") {
            showEndDialog();
        } 
        else {
            next();
        }
    }

    function showReaction(text) {
        reaction.innerText = text;
        reaction.style.opacity = 1;
        setTimeout(() => { reaction.style.opacity = 0; }, 2000);
    }

    // 💡 スタートボタンを押した時の安全な順序制御
    document.getElementById('btn-run').onclick = async () => {
        try {
            // 先にカメラを100%確実に起動させて画面に映す
            await startCamera("user"); 
            document.getElementById('start-screen').style.display = 'none';
            isActive = true;
            
            // 映像が動き出してから、0.5秒のクッションを挟んで安全に音声認識を起動！
            setTimeout(() => {
                initSpeechRecognition();
            }, 500);

            next();
            loop();
        } catch (e) { 
            console.error(e);
            alert("スマホのカメラ起動に失敗しました。Chromeのアドレスバー横のアイコンから、マイクとカメラの『権限』が許可されているか確認してください。"); 
        }
    };

    // ユーザー自身が手動でカメラを切り替えるボタン（安全クッション付き）
    async function toggleCameraHandy() {
        const targetMode = currentFacingMode === "user" ? "environment" : "user";
        try {
            await startCamera(targetMode);
        } catch(err) {
            // スマホ固有のレンズ競合エラーが起きた場合のセーフティ
            console.error("切り替え再試行");
            setTimeout(async () => { await startCamera(targetMode); }, 100);
        }
    }

    function loop() {
        if (!isActive) { requestAnimationFrame(loop); return; }

        c.width = 160; c.height = 120;
        try {
            ctx.drawImage(v, 0, 0, c.width, c.height);
            const currentImgData = ctx.getImageData(0, 0, c.width, c.height);

            if (lastImgData) {
                let diff = 0;
                for (let i = 0; i < currentImgData.data.length; i += 4) {
                    const oldVal = (lastImgData.data[i] + lastImgData.data[i+1] + lastImgData.data[i+2]) / 3;
                    const newVal = (currentImgData.data[i] + currentImgData.data[i+1] + currentImgData.data[i+2]) / 3;
                    diff += Math.abs(newVal - oldVal);
                }
                const movementScore = diff / (c.width * c.height);
                const step = steps[currentStep-1];

                // 1秒残像タイマー
                if (step?.type === "pan_timer" || step?.type === "lock") {
                    if (movementScore > 20) { 
                        if (window.toastTimer) { clearTimeout(window.toastTimer); window.toastTimer = null; }
                        toast.style.display = "block";
                    } else if (movementScore < 10) { 
                        if (!window.toastTimer && toast.style.display === "block") {
                            window.toastTimer = setTimeout(() => { toast.style.display = "none"; window.toastTimer = null; }, 1000); 
                        }
                    }
                }

                if (step?.type === "lock") {
                    if (movementScore < 6) { 
                        staticCount++;
                        if (staticCount > 90) { 
                            target.style.display = "block";
                            staticCount = 0;
                            setTimeout(next, 1000); 
                        }
                    } else {
                        staticCount = 0; 
                        target.style.display = "none";
                    }
                }
            }
            lastImgData = currentImgData;
        } catch(e) { }

        requestAnimationFrame(loop);
    }

    function generateDeepQuestion() {
        let deepMsg = "";

        if (capturedText.match(/(裏切り|挫折|後悔|大変|苦労)/)) {
            deepMsg = "その出来事は、あなたの人生にどんな傷や、逆にどんな強さを残しましたか？";
        } else if (capturedText.match(/(ほしかった|忘れられない|思い出|宝物)/)) {
            deepMsg = "今、それが手に入ったら、当時の自分に何と言ってあげたいですか？";
        } else if (capturedText.match(/(恋|別れ|約束)/)) {
            deepMsg = "そのお相手は、今のあなたの暮らしや頑張りを、どこかで見守ってくれている気がしますか？";
        } else if (capturedText.match(/(家族|父|母|子供)/)) {
            deepMsg = "そのこと、ご家族の方は何と仰っているんですか？";
        } else if (capturedText.match(/(仕事|会社|旅立ち|地元|故郷)/)) {
            deepMsg = "そこから離れて今に至るまでに、一番の心の支えになったものは何ですか？";
        } else {
            deepMsg = "なぜ、今そのお話をしようと思ったんですか？その奥にある想いを聞かせてください。";
        }

        caption.innerText = deepMsg;
        capturedText = ""; 
        isDeepMode = true; 

        // 深掘りに入ったら、手動カメラ切り替えボタンを確実に露出！
        toggleBtn.style.display = "block";
    }

    function showEndDialog() {
        caption.innerText = "お話、ありがとうございます。撮影を終えますか？";
        dialogLayer.style.display = "flex"; 
    }

    function selectChoice(action) {
        dialogLayer.style.display = "none"; 
        
        if (action === 'end') {
            isDeepMode = false;
            toggleBtn.style.display = "none"; 
            next(); 
        } else {
            caption.innerText = "もっと聞かせてください。その奥には、どんな物語がありますか？";
            steps[currentStep-1].type = "voice_more"; 
        }
    }

    async function next() {
        if (currentStep >= steps.length) return;
        const s = steps[currentStep];

        if (s.type === "confirm") {
            const name = detectedName || "渡辺睦";
            s.msg = `ありがとうございます。お名前は ${name} さんでよいですね？`;
        }

        // "部屋全体を撮影してください"（ステップ③）でアウトカメラへ自動切り替え
        if (s.type === "pan_timer") {
            caption.innerText = s.msg;
            caption.style.opacity = 1;
            currentStep++;
            try {
                await startCamera("environment"); // 背面カメラをエラーなく起動
            } catch(e) {
                console.error("再試行");
                setTimeout(async () => { await startCamera("environment"); }, 200);
            }
            setTimeout(next, s.t);
            return;
        }

        caption.innerText = s.msg;
        caption.style.opacity = 1;
        currentStep++;
        
        if (s.type === "last_call") {
            finishLayer.style.display = "flex";
        }
    }
</script>
</body>
</html>
